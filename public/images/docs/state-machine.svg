<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif">
  <style>
    .state { fill: #fff; stroke: #cfd4d3; stroke-width: 1.2; rx: 8 }
    .state-label { fill: #111315; font-size: 13px; font-weight: 500; text-anchor: middle }
    .arrow { stroke: #5b6167; stroke-width: 1.3; fill: none; marker-end: url(#ah) }
    .arrow-special { stroke: #1d4ed8; stroke-width: 1.3; fill: none; marker-end: url(#ah-blue) }
    .trigger { fill: #888e95; font-size: 9.5px; text-anchor: middle }
    .trigger-special { fill: #1d4ed8; font-size: 9.5px; text-anchor: middle }
    .bg { fill: none }

    @media (prefers-color-scheme: dark) {
      .state { fill: #2c2c2e; stroke: #3a3a3c }
      .state-label { fill: #e5e5e7 }
      .arrow { stroke: #8e8e93 }
      .arrow-special { stroke: #5a9cf6 }
      .trigger { fill: #8e8e93 }
      .trigger-special { fill: #5a9cf6 }
    }
  </style>

  <defs>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#5b6167" stroke-width="1"/>
    </marker>
    <marker id="ah-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#1d4ed8" stroke-width="1"/>
    </marker>
  </defs>

  <!-- States -->
  <!-- 等待 -->
  <rect class="state" x="30" y="130" width="90" height="40"/>
  <text class="state-label" x="75" y="156">等待</text>

  <!-- 运行 -->
  <rect class="state" x="220" y="130" width="90" height="40"/>
  <text class="state-label" x="265" y="156">运行</text>

  <!-- 完成 -->
  <rect class="state" x="430" y="50" width="90" height="40"/>
  <text class="state-label" x="475" y="76">完成</text>

  <!-- 失败 -->
  <rect class="state" x="430" y="145" width="90" height="40"/>
  <text class="state-label" x="475" y="171">失败</text>

  <!-- 已暂停 -->
  <rect class="state" x="430" y="240" width="90" height="40"/>
  <text class="state-label" x="475" y="266">已暂停</text>

  <!-- Arrows -->

  <!-- 等待 → 运行：调度 -->
  <line class="arrow" x1="120" y1="150" x2="218" y2="150"/>
  <text class="trigger" x="170" y="142">调度</text>

  <!-- 运行 → 完成：所有步骤完成 -->
  <path class="arrow" d="M 310,142 Q 370,70 428,70"/>
  <text class="trigger" x="356" y="88">所有步骤完成</text>

  <!-- 运行 → 失败：步骤错误 -->
  <line class="arrow" x1="310" y1="158" x2="428" y2="162"/>
  <text class="trigger" x="370" y="152">步骤错误</text>

  <!-- 运行 → 已暂停：用户暂停 -->
  <path class="arrow" d="M 310,165 Q 370,240 428,255"/>
  <text class="trigger" x="358" y="228">用户暂停</text>

  <!-- 失败 → 等待：重新开始 -->
  <path class="arrow" d="M 430,180 Q 250,230 120,168"/>
  <text class="trigger" x="260" y="214">重新开始</text>

  <!-- 已暂停 → 等待：恢复 -->
  <path class="arrow" d="M 430,268 Q 250,300 75,172"/>
  <text class="trigger" x="240" y="298">恢复</text>

  <!-- 完成 → 等待：勾选新文件（特殊路径） -->
  <path class="arrow-special" d="M 430,62 Q 240,20 80,128"/>
  <text class="trigger-special" x="250" y="32">勾选了新的未完成文件</text>

  <!-- Entry: → 等待 -->
  <circle cx="12" cy="150" r="5" fill="#5b6167"/>
  <line class="arrow" x1="17" y1="150" x2="28" y2="150"/>
</svg>

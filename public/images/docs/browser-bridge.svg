<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif">
  <style>
    .box { fill: #fff; stroke: #cfd4d3; stroke-width: 1; rx: 6 }
    .box-label { fill: #111315; font-size: 11px; font-weight: 500 }
    .box-detail { fill: #5b6167; font-size: 9.5px }
    .context { fill: #888e95; font-size: 9px; text-anchor: middle }
    .entry { fill: #111315; font-size: 11px; font-weight: 500 }
    .entry-num { fill: #1d4ed8; font-size: 11px; font-weight: 700 }
    .arrow { stroke: #5b6167; stroke-width: 1.3; fill: none; marker-end: url(#ah) }
    .arrow-skip { stroke: #aab0b6; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; marker-end: url(#ah-skip) }
    .arrow-ws { stroke: #1d4ed8; stroke-width: 1.5; fill: none; marker-end: url(#ah-blue) }
    .ws-label { fill: #1d4ed8; font-size: 9.5px; font-weight: 500; text-anchor: middle }

    @media (prefers-color-scheme: dark) {
      .box { fill: #2c2c2e; stroke: #3a3a3c }
      .box-label { fill: #e5e5e7 }
      .box-detail { fill: #8e8e93 }
      .context { fill: #8e8e93 }
      .entry { fill: #e5e5e7 }
      .entry-num { fill: #5a9cf6 }
      .arrow { stroke: #8e8e93 }
      .arrow-skip { stroke: #555 }
      .arrow-ws { stroke: #5a9cf6 }
      .ws-label { fill: #5a9cf6 }
    }
  </style>

  <defs>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#5b6167" stroke-width="1"/>
    </marker>
    <marker id="ah-skip" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#aab0b6" stroke-width="1"/>
    </marker>
    <marker id="ah-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#1d4ed8" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Context labels -->
  <text class="context" x="193" y="14">MAIN world</text>
  <text class="context" x="320" y="14">ISOLATED</text>
  <text class="context" x="440" y="14">ISOLATED</text>
  <text class="context" x="560" y="14">Background</text>
  <text class="context" x="700" y="14">桌面端</text>

  <!-- Box 1: MSE Probe -->
  <rect class="box" x="140" y="28" width="106" height="60"/>
  <text class="box-label" x="152" y="46">MSE 探针</text>
  <text class="box-detail" x="152" y="60">拦截 appendBuffer</text>
  <text class="box-detail" x="152" y="74">URL ↔ 视频元素</text>

  <!-- Box 2: Attribution -->
  <rect class="box" x="264" y="28" width="112" height="60"/>
  <text class="box-label" x="276" y="46">归属引擎</text>
  <text class="box-detail" x="276" y="60">每个视频一个会话</text>
  <text class="box-detail" x="276" y="74">临时 → 锁定归属</text>

  <!-- Box 3: Strategy -->
  <rect class="box" x="394" y="28" width="106" height="60"/>
  <text class="box-label" x="406" y="46">站点策略</text>
  <text class="box-detail" x="406" y="60">按域名分发</text>
  <text class="box-detail" x="406" y="74">→ Selection</text>

  <!-- Box 4: Resource Cache -->
  <rect class="box" x="518" y="28" width="106" height="60"/>
  <text class="box-label" x="530" y="46">资源缓存</text>
  <text class="box-detail" x="530" y="60">补充请求头和元数据</text>
  <text class="box-detail" x="530" y="74">未命中等 1500ms</text>

  <!-- Box 5: Desktop -->
  <rect class="box" x="652" y="28" width="96" height="60"/>
  <text class="box-label" x="664" y="52">解析</text>
  <text class="box-detail" x="664" y="68">→ 入队 → 执行</text>

  <!-- Main flow arrows -->
  <line class="arrow" x1="246" y1="58" x2="262" y2="58"/>
  <line class="arrow" x1="376" y1="58" x2="392" y2="58"/>
  <line class="arrow" x1="500" y1="58" x2="516" y2="58"/>
  <line class="arrow-ws" x1="624" y1="58" x2="650" y2="58"/>
  <text class="ws-label" x="637" y="50">WS</text>

  <!-- Entry 1 -->
  <text class="entry-num" x="12" y="62">1</text>
  <text class="entry" x="26" y="62">视频下载按钮</text>
  <line class="arrow" x1="122" y1="58" x2="138" y2="58"/>

  <!-- Entry 2 -->
  <text class="entry-num" x="12" y="158">2</text>
  <text class="entry" x="26" y="158">下载接管</text>
  <path class="arrow-skip" d="M 100,154 Q 320,154 518,86"/>

  <!-- Entry 3 -->
  <text class="entry-num" x="12" y="214">3</text>
  <text class="entry" x="26" y="214">外部扩展</text>
  <path class="arrow-skip" d="M 92,210 Q 320,210 518,90"/>

  <!-- Legend -->
  <line x1="12" y1="262" x2="42" y2="262" stroke="#5b6167" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
  <text class="box-detail" x="48" y="266">完整管道</text>

  <line x1="130" y1="262" x2="160" y2="262" stroke="#aab0b6" stroke-width="1.2" stroke-dasharray="5 3" fill="none" marker-end="url(#ah-skip)"/>
  <text class="box-detail" x="166" y="266">跳过页面媒体识别，直接进入 Background</text>
</svg>

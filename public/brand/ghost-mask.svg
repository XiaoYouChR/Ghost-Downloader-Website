<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mask companion to ghost-mark.svg.

    Used as a CSS mask layer with `mask-composite: exclude`, so this shape is
    what gets *subtracted* from the connection field. The blur gives the field
    its soft edge, and `evenodd` means the eyes are holes within the hole —
    which is exactly what keeps the lines inside them at full strength.
  -->
  <filter id="soften" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="0.18" />
  </filter>
  <path filter="url(#soften)" fill="#000" fill-rule="evenodd" clip-rule="evenodd" d="M12 2C8.13 2 5 5.13 5 9V14C5 14.55 4.55 15 4 15H3V17H4.1C4.54 18.7 6.08 20 7.9 20C8.36 20 8.81 19.92 9.22 19.78C10.05 20.54 11.08 21 12.2 21C13.25 21 14.23 20.57 15 19.91C15.7 20.58 16.65 21 17.7 21C19.52 21 21 19.52 21 17.7V9C21 5.13 17.87 2 14 2H12ZM8 9.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0ZM14 9.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0Z"/>
</svg>
